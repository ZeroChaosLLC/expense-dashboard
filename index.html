<!DOCTYPE html><html lang="en"><head>
<title>Expenses | ZCC</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--black:#0a0a08;--charcoal:#1c1c1a;--dark-mid:#2a2a27;--muted:#6b6b65;--faint:#9a9a92;--white:#f4f4ee;--amber:#c8832a;--red:#e05555;--green:#4caf7d;}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--black);color:var(--white);line-height:1.6;}
  .hidden{display:none !important;}
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{width:100%;max-width:360px;border-top:2px solid var(--amber);border-bottom:2px solid var(--amber);padding:36px 0;}
  .login-box h1{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:2px;line-height:1;margin-bottom:6px;}
  .login-box p{color:var(--faint);font-size:14px;margin-bottom:28px;}
  .or{display:flex;align-items:center;gap:12px;color:var(--muted);font-family:'DM Mono',monospace;font-size:12px;margin:18px 0;}
  .or::before,.or::after{content:'';flex:1;height:1px;background:var(--dark-mid);}
  .login-error{color:var(--red);font-size:13px;min-height:20px;margin-top:12px;}
  .page{max-width:1400px;margin:0 auto;padding:40px 20px;}
  .header{margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid var(--dark-mid);display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
  .header h1{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;line-height:1;}
  .header-right{display:flex;gap:10px;align-items:center;font-family:'DM Mono',monospace;font-size:12px;color:var(--faint);flex-wrap:wrap;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:28px;}
  .stat-card{background:var(--dark-mid);padding:18px 20px;border-left:3px solid var(--amber);}
  .stat-label{font-family:'DM Mono',monospace;font-size:12px;color:var(--faint);margin-bottom:6px;}
  .stat-number{font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;}
  .filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .filter-btn{padding:8px 16px;background:var(--dark-mid);border:1px solid var(--muted);color:var(--white);cursor:pointer;font-family:'DM Mono',monospace;font-size:12px;}
  .filter-btn.active{background:var(--amber);color:#0a0a08;border-color:var(--amber);}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .button{padding:8px 16px;background:var(--amber);color:#0a0a08 !important;border:none;cursor:pointer;font-family:'DM Mono',monospace;font-size:12px;font-weight:500;}
  .button:hover{opacity:0.9;}
  .button:disabled{opacity:0.5;cursor:default;}
  .button.ghost{background:var(--charcoal);color:var(--white) !important;border:1px solid var(--muted);}
  .button.danger{background:var(--red);color:var(--white) !important;}
  .button.wide{width:100%;padding:12px;font-size:13px;}
  .form-group{margin-bottom:16px;}
  .form-group label{display:block;font-family:'DM Mono',monospace;font-size:12px;color:var(--faint);margin-bottom:6px;}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px;background:var(--charcoal);border:1px solid var(--muted);color:var(--white);font-family:'DM Sans',sans-serif;font-size:14px;}
  .form-group textarea{min-height:90px;resize:vertical;}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--amber);}
  .loading{text-align:center;padding:40px;color:var(--faint);font-family:'DM Mono',monospace;font-size:13px;}
  .error{color:var(--red);}
  .empty{text-align:center;padding:40px;color:var(--faint);}
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:100;align-items:center;justify-content:center;padding:20px;}
  .modal.active{display:flex;}
  .modal-content{background:var(--dark-mid);padding:32px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;}
  .modal-content h3{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;margin-bottom:20px;}
  .modal-buttons{display:flex;gap:12px;margin-top:24px;}
  .modal-buttons button{flex:1;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--charcoal);border:1px solid var(--amber);padding:12px 18px;font-family:'DM Mono',monospace;font-size:12px;opacity:0;transition:all .25s;z-index:200;max-width:90vw;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.bad{border-color:var(--red);}
  @media (prefers-reduced-motion:reduce){.toast{transition:none;}}
  .table-container{background:var(--dark-mid);overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:820px;}
  th{background:var(--charcoal);padding:12px;text-align:left;font-family:'DM Mono',monospace;font-size:11px;color:var(--faint);border-bottom:1px solid var(--muted);font-weight:500;}
  td{padding:12px;border-bottom:1px solid var(--charcoal);font-size:14px;vertical-align:top;}
  td.amt{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--amber);}
  td.purpose{max-width:220px;color:var(--faint);font-size:13px;}
  .link{background:none;border:none;color:var(--amber);cursor:pointer;font-family:'DM Mono',monospace;font-size:12px;text-decoration:underline;}
  .row-actions{display:flex;gap:6px;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .hint{font-size:12px;color:var(--faint);margin-top:6px;}
  .tax{margin-top:28px;background:var(--dark-mid);padding:20px;}
  .tax h2{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;margin-bottom:10px;}
  .cat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--charcoal);font-size:14px;}
  .cat-row:last-child{border-bottom:none;}
  @media (max-width:600px){.two{grid-template-columns:1fr;}}
</style></head><body>
<div id="login" class="hidden">
  <div class="login-box">
    <h1>Zero Chaos Coffee</h1>
    <p>Sign in to continue.</p>
    <button type="button" class="button wide" id="passkeyLoginBtn">Sign in with Face ID</button>
    <div class="or">or use your password</div>
    <form id="loginForm">
      <div class="form-group"><label for="loginEmail">Email</label><input type="email" id="loginEmail" autocomplete="username webauthn" required></div>
      <div class="form-group"><label for="loginPassword">Password</label><input type="password" id="loginPassword" autocomplete="current-password" required></div>
      <button type="submit" class="button wide ghost" id="loginBtn">Sign in with password</button>
    </form>
    <div class="login-error" id="loginError"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="app" class="page hidden">
  <div class="header">
    <h1>Expenses</h1>
    <div class="header-right">
      <span id="whoami"></span>
      <button class="button ghost" id="exportBtn">Export CSV</button>
      <button class="button ghost" id="addPasskeyBtn">Add Face ID</button>
      <button class="button ghost" id="signOutBtn">Sign out</button>
      <button class="button" id="addBtn">Add expense</button>
    </div>
  </div>
  <div class="stats">
    <div class="stat-card"><div class="stat-label">Total spent</div><div class="stat-number" id="valTotal">$0.00</div></div>
    <div class="stat-card"><div class="stat-label">Deductible</div><div class="stat-number" id="valDeduct">$0.00</div></div>
    <div class="stat-card"><div class="stat-label" id="lblMonth">This month</div><div class="stat-number" id="valMonth">$0.00</div></div>
    <div class="stat-card"><div class="stat-label" id="lblYtd">Year to date</div><div class="stat-number" id="valYtd">$0.00</div></div>
  </div>
  <div class="filters" id="filters">
    <button class="filter-btn active" data-cat="ALL">All</button>
    <button class="filter-btn" data-cat="Product Research">Product research</button>
    <button class="filter-btn" data-cat="Marketing">Marketing</button>
    <button class="filter-btn" data-cat="Meals & Entertainment">Meals</button>
    <button class="filter-btn" data-cat="Travel">Travel</button>
    <button class="filter-btn" data-cat="Supplies & Equipment">Supplies</button>
    <button class="filter-btn" data-cat="Other">Other</button>
  </div>
  <div id="loading" class="loading">Loading expenses...</div>
  <div class="table-container"><table>
    <thead><tr><th>Date</th><th>Vendor</th><th>Amount</th><th>Category</th><th>Deductible</th><th>Receipt</th><th>Purpose</th><th></th></tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
  <div class="tax">
    <h2>By category</h2>
    <div id="catBreakdown"></div>
  </div>
</div>

<div id="expModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="expTitle">
  <div class="modal-content">
    <h3 id="expTitle">New expense</h3>
    <div class="two">
      <div class="form-group"><label for="fDate">Date</label><input type="date" id="fDate"></div>
      <div class="form-group"><label for="fAmount">Amount ($)</label><input type="number" id="fAmount" step="0.01" min="0" inputmode="decimal"></div>
    </div>
    <div class="form-group"><label for="fVendor">Vendor / description</label><input type="text" id="fVendor"></div>
    <div class="two">
      <div class="form-group"><label for="fCategory">Category</label>
        <select id="fCategory"><option value="">Select</option><option>Product Research</option><option>Marketing</option><option>Meals & Entertainment</option><option>Travel</option><option>Supplies & Equipment</option><option>Other</option></select></div>
      <div class="form-group"><label for="fDeduct">Deductibility</label>
        <select id="fDeduct"><option value="">Select</option><option value="100%">100% deductible</option><option value="50%">50% deductible</option><option value="Non-deductible">Non-deductible</option></select></div>
    </div>
    <div class="form-group"><label for="fPurpose">Business purpose (required for tax records)</label><textarea id="fPurpose"></textarea></div>
    <div class="form-group"><label for="fNotes">Notes / attendees</label><input type="text" id="fNotes"></div>
    <div class="form-group"><label for="fReceipt">Receipt (photo or PDF)</label><input type="file" id="fReceipt" accept="image/*,application/pdf"><div class="hint" id="receiptHint"></div></div>
    <div class="login-error" id="formError"></div>
    <div class="modal-buttons"><button class="button ghost" id="cancelBtn">Cancel</button><button class="button" id="saveBtn">Save expense</button></div>
  </div>
</div>

<div id="delModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="delTitle">
  <div class="modal-content">
    <h3 id="delTitle">Delete expense?</h3>
    <p id="delText"></p>
    <div class="modal-buttons"><button class="button ghost" id="delCancel">Cancel</button><button class="button danger" id="delConfirm">Delete expense</button></div>
  </div>
</div>
<script>
  const SUPABASE_URL = 'https://nhdypjjikdcpmjjbjalb.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZHlwamppa2RjcG1qamJqYWxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1ODM2OTksImV4cCI6MjA5MzE1OTY5OX0.hF4kQsmUiCnSvHlIsQZMEoNha_xDq5307CNJRbPiypY';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { experimental: { passkey: true } }
  });
  const $ = id => document.getElementById(id);

  function esc(s) {
    if (s === null || s === undefined || s === '') return '—';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  let toastTimer;
  function toast(msg, bad) {
    const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast', 3200);
  }

  function showLogin() { $('app').classList.add('hidden'); $('login').classList.remove('hidden'); }
  function showApp(user) {
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    $('whoami').textContent = user.email || '';
    onSignedIn();
  }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('loginBtn'); btn.disabled = true; btn.textContent = 'Signing in...'; $('loginError').textContent = '';
    const { data, error } = await db.auth.signInWithPassword({ email: $('loginEmail').value.trim(), password: $('loginPassword').value });
    btn.disabled = false; btn.textContent = 'Sign in with password';
    if (error) { $('loginError').textContent = 'Sign-in failed: ' + error.message; return; }
    $('loginPassword').value = ''; showApp(data.user);
  });

  $('passkeyLoginBtn').addEventListener('click', async () => {
    $('loginError').textContent = '';
    try {
      const { data, error } = await db.auth.signInWithPasskey();
      if (error) throw error;
      showApp(data.user || data.session.user);
    } catch (err) {
      $('loginError').textContent = 'Face ID sign-in did not work: ' + (err.message || err) + '. Use your password, then tap "Add Face ID" once signed in.';
    }
  });

  $('addPasskeyBtn').addEventListener('click', async () => {
    try {
      const { error } = await db.auth.registerPasskey();
      if (error) throw error;
      toast('Face ID added. Next time, tap "Sign in with Face ID".');
    } catch (err) {
      toast('Could not add Face ID: ' + (err.message || err), true);
    }
  });

  $('signOutBtn').addEventListener('click', async () => { await db.auth.signOut(); location.reload(); });

  (async () => {
    const { data } = await db.auth.getSession();
    if (data.session) showApp(data.session.user); else showLogin();
  })();
  const BUCKET = 'expense-receipts';   // private bucket; files are only viewable while signed in
  let expenses = [], cat = 'ALL', editId = null, deleteId = null;
  const money = n => '$' + (Number(n) || 0).toFixed(2);
  function onSignedIn() { loadExpenses(); }
  async function loadExpenses() {
    const { data, error } = await db.from('expenses').select('*').order('date', { ascending: false }).order('created_at', { ascending: false });
    if (error) { $('loading').innerHTML = '<span class="error">Could not load expenses: ' + esc(error.message) + '</span>'; return; }
    expenses = data || []; $('loading').style.display = 'none'; stats(); render();
  }
  function stats() {
    const now = new Date(), ym = now.toISOString().slice(0, 7), y = String(now.getFullYear());
    let total = 0, ded = 0, month = 0, ytd = 0; const cats = {};
    expenses.forEach(r => { const a = Number(r.amount) || 0; total += a;
      if (r.deductibility === '100%') ded += a; if (r.deductibility === '50%') ded += a * 0.5;
      if ((r.date || '').startsWith(ym)) month += a; if ((r.date || '').startsWith(y)) ytd += a;
      cats[r.category || 'Other'] = (cats[r.category || 'Other'] || 0) + a; });
    $('valTotal').textContent = money(total); $('valDeduct').textContent = money(ded);
    $('valMonth').textContent = money(month); $('valYtd').textContent = money(ytd);
    $('lblMonth').textContent = now.toLocaleString('default', { month: 'long' }); $('lblYtd').textContent = y + ' to date';
    $('catBreakdown').innerHTML = Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="cat-row"><span>${esc(k)}</span><span>${money(v)}</span></div>`).join('') || '<div class="empty">No expenses yet.</div>';
  }
  function fmtDate(d) { if (!d) return '—'; const [y, m, day] = d.split('-'); return `${m}/${day}/${y}`; }
  function render() {
    const rows = cat === 'ALL' ? expenses : expenses.filter(r => r.category === cat);
    $('tbody').innerHTML = rows.length ? rows.map(r => `<tr>
      <td>${fmtDate(r.date)}</td><td>${esc(r.vendor)}</td><td class="amt">${money(r.amount)}</td><td>${esc(r.category)}</td><td>${esc(r.deductibility)}</td>
      <td>${r.receipt_url ? `<button class="link" data-receipt="${esc(r.id)}">View</button>` : '—'}</td>
      <td class="purpose">${esc(r.business_purpose)}</td>
      <td><div class="row-actions"><button class="button ghost" data-edit="${esc(r.id)}">Edit</button><button class="button ghost" data-del="${esc(r.id)}">Delete</button></div></td></tr>`).join('')
      : '<tr><td colspan="8" class="empty">No expenses in this view.</td></tr>';
  }
  $('filters').addEventListener('click', e => { const b = e.target.closest('.filter-btn'); if (!b) return;
    document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active')); b.classList.add('active'); cat = b.dataset.cat; render(); });

  $('tbody').addEventListener('click', async e => {
    const rc = e.target.closest('[data-receipt]'), ed = e.target.closest('[data-edit]'), dl = e.target.closest('[data-del]');
    if (rc) {
      const r = expenses.find(x => String(x.id) === rc.dataset.receipt);
      const win = window.open('', '_blank');
      const { data, error } = await db.storage.from(BUCKET).createSignedUrl(r.receipt_url, 300);
      if (error) { if (win) win.close(); toast('Could not open receipt: ' + error.message, true); return; }
      if (win) win.location = data.signedUrl; else location.href = data.signedUrl;
    }
    if (ed) openModal(ed.dataset.edit);
    if (dl) { deleteId = dl.dataset.del; const r = expenses.find(x => String(x.id) === deleteId);
      $('delText').textContent = `${r.vendor} — ${money(r.amount)}. This can't be undone.`; $('delModal').classList.add('active'); }
  });

  function openModal(id) {
    editId = id || null; const r = id ? expenses.find(x => String(x.id) === id) : null;
    $('expTitle').textContent = r ? 'Edit expense' : 'New expense'; $('saveBtn').textContent = r ? 'Save changes' : 'Save expense';
    $('fDate').value = r ? r.date : new Date().toISOString().split('T')[0]; $('fAmount').value = r ? r.amount : '';
    $('fVendor').value = r ? r.vendor || '' : ''; $('fCategory').value = r ? r.category || '' : ''; $('fDeduct').value = r ? r.deductibility || '' : '';
    $('fPurpose').value = r ? r.business_purpose || '' : ''; $('fNotes').value = r ? r.notes || '' : ''; $('fReceipt').value = '';
    $('receiptHint').textContent = r && r.receipt_url ? 'A receipt is on file. Choosing a new file replaces it.' : '';
    $('formError').textContent = ''; $('expModal').classList.add('active');
  }
  function closeModals() { $('expModal').classList.remove('active'); $('delModal').classList.remove('active'); editId = null; deleteId = null; }
  $('addBtn').addEventListener('click', () => openModal());
  $('cancelBtn').addEventListener('click', closeModals); $('delCancel').addEventListener('click', closeModals);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModals(); });

  $('saveBtn').addEventListener('click', async () => {
    const f = { date: $('fDate').value, amount: parseFloat($('fAmount').value), vendor: $('fVendor').value.trim(), category: $('fCategory').value,
      deductibility: $('fDeduct').value, business_purpose: $('fPurpose').value.trim(), notes: $('fNotes').value.trim() || null };
    const missing = [!f.date && 'date', !(f.amount > 0) && 'amount', !f.vendor && 'vendor', !f.category && 'category', !f.deductibility && 'deductibility', !f.business_purpose && 'business purpose'].filter(Boolean);
    if (missing.length) { $('formError').textContent = 'Fill in: ' + missing.join(', ') + '.'; return; }
    const btn = $('saveBtn'); btn.disabled = true; btn.textContent = 'Saving...';
    const file = $('fReceipt').files[0];
    if (file) {
      const path = `${new Date().getFullYear()}/${Date.now()}-${file.name.replace(/[^\w.\-]/g, '_')}`;
      const { error: upErr } = await db.storage.from(BUCKET).upload(path, file, { contentType: file.type });
      if (upErr) { btn.disabled = false; btn.textContent = 'Save expense'; $('formError').textContent = 'Receipt upload failed: ' + upErr.message + '. Nothing was saved.'; return; }
      f.receipt_url = path;
    }
    const q = editId ? db.from('expenses').update(f).eq('id', editId).select() : db.from('expenses').insert(f).select();
    const { data, error } = await q;
    btn.disabled = false; btn.textContent = editId ? 'Save changes' : 'Save expense';
    if (error || !data || !data.length) { $('formError').textContent = 'Save failed: ' + (error ? error.message : 'no row saved'); return; }
    closeModals(); toast(editId ? 'Expense updated' : 'Expense saved'); loadExpenses();
  });

  $('delConfirm').addEventListener('click', async () => {
    const r = expenses.find(x => String(x.id) === deleteId);
    const { data, error } = await db.from('expenses').delete().eq('id', deleteId).select();
    if (error || !data || !data.length) { toast('Delete failed: ' + (error ? error.message : 'no row deleted'), true); return; }
    if (r && r.receipt_url) await db.storage.from(BUCKET).remove([r.receipt_url]);
    closeModals(); toast('Expense deleted'); loadExpenses();
  });

  $('exportBtn').addEventListener('click', () => {
    if (!expenses.length) { toast('No expenses to export', true); return; }
    const head = ['Date','Vendor','Amount','Category','Deductibility','Business Purpose','Notes','Receipt on file'];
    const rows = expenses.map(r => [r.date, r.vendor, r.amount, r.category, r.deductibility, r.business_purpose, r.notes, r.receipt_url ? 'Yes' : 'No'].map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(','));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([[head.join(','), ...rows].join('\n')], { type: 'text/csv' }));
    a.download = 'zcc-expenses-' + new Date().toISOString().split('T')[0] + '.csv'; a.click(); toast('CSV exported');
  });
</script></body></html>
